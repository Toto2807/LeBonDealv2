# Pile complète : MongoDB + API + frontend (nginx). À combiner avec docker-compose.yml :
#
#   docker compose --env-file backend/.env -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   -> application sur http://localhost:8080 (WEB_PORT), l'API passe par nginx (/api)
#
# Arrêt : docker compose --env-file backend/.env -f docker-compose.yml -f docker-compose.prod.yml down
# En production, JWT_SECRET et les mots de passe MongoDB doivent être générés (jamais les valeurs d'exemple).
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Dans le réseau Docker, MongoDB s'appelle "mongo" (et non localhost).
      MONGODB_URI: "mongodb://${MONGO_APP_USER:-lebondeal_app}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_APP_DB:-lebondeal}?authSource=admin"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET manquant, voir backend/.env.example}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-2h}"
      CORS_ORIGIN: "http://localhost:${WEB_PORT:-8080}"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
